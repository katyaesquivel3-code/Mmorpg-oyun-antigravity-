name: Otuken CI & Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: 🧪 Web Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Type Check
        run: npx tsc --noEmit

      - name: 🏗️ Build Web Assets
        run: npm run build

      - name: 🎯 Run All Faz Integration Tests (Faz 6 to 12)
        run: npm test

  android-build:
    name: 📱 Android APK & AAB Production Build
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Web Bundle
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔧 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build Debug & Release APKs and Release AAB Bundle
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otuken-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 📤 Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otuken-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: 📤 Upload Google Play Release AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: otuken-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
